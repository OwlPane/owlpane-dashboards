name: Lint library dashboards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-variables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check actions are pinned to commit SHAs
        run: bash scripts/check-pinned-actions.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Variable names (Owlpane NAME_RE)
        run: node scripts/lint-library-dashboard-variables.mjs
      - name: No upstream residue in library JSON
        run: node scripts/lint-upstream-residue.mjs
      - name: Normalizer keeps copyright lines and strips sample streams
        run: node --test scripts/normalize-for-owlpane.test.mjs

name: Lint library dashboards

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-variables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Variable names (Owlpane NAME_RE)
        run: node scripts/lint-library-dashboard-variables.mjs
      - name: O2 stream parity (otel-collector folder)
        run: node scripts/audit-o2-stream-parity.mjs
